<!doctype html>
<html lang="es">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Monitor de video y alertas</title>
<style>
body{font:16px system-ui;background:#101820;color:#ecf2f5;margin:0;padding:24px;max-width:1100px;margin:auto}
h1{font-size:24px}input,button{font:inherit;padding:10px;border-radius:6px;border:1px solid #70818b}button{cursor:pointer;background:#a7e8ce;color:#101820}form{display:flex;gap:8px;flex-wrap:wrap}img{max-width:100%;background:#192832;min-height:180px}section{margin:24px 0}li{margin:10px 0}small{color:#adbdc7}#message{min-height:24px}a{color:#a7e8ce}
</style>
<h1>Monitor de video y alertas</h1>
<form id="login"><input id="email" type="email" autocomplete="username" placeholder="Correo" required aria-label="Correo">
<input id="password" type="password" autocomplete="current-password" placeholder="Contraseña" required aria-label="Contraseña"><button>Entrar</button></form>
<button id="logout" hidden>Salir</button><p id="message" role="status">Inicia sesión con una cuenta ADMIN o GUARDIA.</p>
<section><img id="video" alt="Esperando video"><p id="frame"></p><small>La fuente puede ser sintética o un archivo. El monitor no envía comandos de vuelo.</small></section>
<section><h2>Alertas abiertas</h2><ul id="alerts"></ul></section>
<script>
const base=location.pathname.replace(/\/video\/viewer\/?$/, "");
const $=id=>document.getElementById(id);
let token="", controller, picture, evidenceUrls=[];
const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));
function exit(){token="";controller?.abort();if(picture)URL.revokeObjectURL(picture);evidenceUrls.forEach(URL.revokeObjectURL);evidenceUrls=[];$("video").removeAttribute("src");$("alerts").replaceChildren();$("login").hidden=false;$("logout").hidden=true;$("frame").textContent="";$("message").textContent="Sesión cerrada en este monitor.";}
$("logout").onclick=exit;
async function api(path,options={}){const response=await fetch(base+path,{...options,headers:{...options.headers,Authorization:"Bearer "+token},signal:controller.signal,cache:"no-store"});if(response.status===401){exit();throw Error("Sesión vencida");}if(!response.ok)throw Error("HTTP "+response.status);return response;}
$("login").onsubmit=async event=>{event.preventDefault();try{const response=await fetch(base+"/auth/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:$("email").value,password:$("password").value})});$("password").value="";if(!response.ok)throw Error("No se pudo iniciar sesión");token=(await response.json()).access_token;controller=new AbortController();$("login").hidden=true;$("logout").hidden=false;stream(controller.signal);alerts(controller.signal);}catch(error){$("message").textContent=error.message;}};
async function stream(signal){while(!signal.aborted){try{const response=await api("/video/stream");const reader=response.body.getReader();let buffer=new Uint8Array();$("message").textContent="Video conectado";try{while(!signal.aborted){const {done,value}=await reader.read();if(done)break;const next=new Uint8Array(buffer.length+value.length);next.set(buffer);next.set(value,buffer.length);buffer=next;if(buffer.length>8*1024*1024)throw Error("Frame demasiado grande");while(true){let end=-1;for(let i=0;i<buffer.length-3;i++){if(buffer[i]===13&&buffer[i+1]===10&&buffer[i+2]===13&&buffer[i+3]===10){end=i;break;}}if(end<0)break;const header=new TextDecoder().decode(buffer.slice(0,end));const match=/Content-Length: (\d+)/i.exec(header);if(!match)throw Error("Stream inválido");const size=Number(match[1]);if(size>8*1024*1024)throw Error("Frame demasiado grande");if(buffer.length<end+4+size+2)break;const previous=picture;picture=URL.createObjectURL(new Blob([buffer.slice(end+4,end+4+size)],{type:"image/jpeg"}));$("video").src=picture;if(previous)URL.revokeObjectURL(previous);$("frame").textContent=(/X-Frame-Sequence: ([^\r]+)/i.exec(header)?.[1]||"")+" · "+(/X-Captured-At: ([^\r]+)/i.exec(header)?.[1]||"");buffer=buffer.slice(end+4+size+2);}}}finally{await reader.cancel();}}catch(error){if(signal.aborted)return;$("video").removeAttribute("src");$("frame").textContent="";$("message").textContent="Video no disponible; reintentando ("+error.message+")";}await sleep(1000);}}
async function alerts(signal){while(!signal.aborted){try{const items=await(await api("/alerts/?limit=100")).json();if(signal.aborted)return;$("alerts").replaceChildren();evidenceUrls.forEach(URL.revokeObjectURL);evidenceUrls=[];for(const item of items){const li=document.createElement("li");const label=document.createElement("span");label.textContent=item.tipo+" · "+item.estado+" · "+item.created_at+" ";li.append(label);if(item.estado==="PENDIENTE"){const button=document.createElement("button");button.textContent="Marcar en revisión";button.onclick=async()=>{button.disabled=true;try{await api("/alerts/"+item.id+"/ack",{method:"POST"});button.textContent="En revisión";}catch{button.disabled=false;}};li.append(button);}const evidence=item.detecciones.find(d=>d.frame_url?.startsWith(base+"/evidence/"));if(evidence){const button=document.createElement("button");button.textContent="Ver evidencia";button.onclick=async()=>{try{const response=await api(evidence.frame_url.slice(base.length));if(signal.aborted)return;const url=URL.createObjectURL(await response.blob());evidenceUrls.push(url);const img=document.createElement("img");img.src=url;img.alt="Evidencia de "+item.tipo;li.append(img);button.disabled=true;}catch{button.textContent="Evidencia no disponible";}};li.append(button);}$("alerts").append(li);}if(!items.length)$("alerts").textContent="Sin alertas abiertas";}catch{if(signal.aborted)return;}await sleep(5000);}}
</script>
</html>
