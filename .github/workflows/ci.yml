name: Backend CI (Lint & Build Check)

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: drones_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_user -d drones_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_POSTGRES_URL: postgresql://test_user:test_password@localhost:5432/drones_test

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest fastapi pydantic
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Validar estilo con Ruff (Linter)
        run: ruff check .

      - name: Validar formato con Ruff (Format Check)
        run: ruff format --check .

      - name: Ejecutar pruebas unitarias (Pytest)
        run: pytest tests/
